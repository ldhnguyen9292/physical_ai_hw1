# Lightweight env for Phase 1 reconstruction on Intel macOS (no Habitat-Sim).
# Usage (from hw1/):  pixi run --manifest-path macos-intel/pixi.toml python reconstruct.py ...

[workspace]
name = "hw1-recon-macos-intel"
channels = ["conda-forge"]
platforms = ["osx-64"]

[dependencies]
python = "3.10.*"
numpy = "1.26.*"
scipy = "*"
matplotlib = "*"
pillow = "*"
rdflib = "*"
pytest = "*"
llvm-openmp = "*"

[pypi-dependencies]
open3d = "*"
opencv-python = "==4.8.0.76"
panel = "==1.4.5"
bokeh = "==3.4.3"
