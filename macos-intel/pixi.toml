# Lightweight env for Phase 1 reconstruction on Intel macOS (no Habitat-Sim).
# Versions are pinned to match the course `habitat` env (see ../pixi.lock)
# so reconstruction results stay as close as possible to the TA's setup.
# Exception: the course uses open3d 0.18.0, whose macOS wheel is arm64-only,
# so this Intel-mac env uses open3d 0.19.0 instead.
# Usage (from repo root):
#   pixi run --manifest-path macos-intel/pixi.toml python reconstruct.py ...

[workspace]
name = "hw1-recon-macos-intel"
channels = ["conda-forge"]
platforms = ["osx-64"]

[dependencies]
python = "3.9.*"
numpy = "1.26.4.*"
scipy = "1.13.*"
matplotlib = "*"
pillow = "*"
rdflib = "*"
pytest = "*"
llvm-openmp = "*"

[pypi-dependencies]
open3d = "==0.19.0"
opencv-python = "==4.8.0.76"
panel = "==1.4.5"
bokeh = "==3.4.3"
